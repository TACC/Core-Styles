# v2 consumers expect a built dist/ committed in the repo (not just published to
# npm), and release-please doesn't build packages itself. So whenever
# release-please (re)writes its release PR branch, rebuild dist/ and commit any
# diff back onto that same branch before it gets merged.
#
# release-please force-pushes this branch on every update, so this workflow
# re-runs and re-commits each time; if there's no diff, git-auto-commit-action
# is a no-op. The commit uses the default GITHUB_TOKEN, whose pushes don't
# cascade-trigger other workflows, so this can't loop on itself.
#
# release-please updates this branch via two pushes per cycle: first it
# resets the branch to the new main tip (no release commit yet), then it
# pushes its own version-bump commit on top. Only the second push needs a
# rebuild, so skip the job unless the head commit is release-please's own
# bump commit.

name: Build dist for v2 release

on:
  push:
    branches:
      - 'release-please--branches--main*'

permissions:
  contents: write

jobs:
  build-dist:
    if: startsWith(github.event.head_commit.message, 'chore(main): release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build:css
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(dist): build for release"
          file_pattern: dist
